<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#050b16"><meta name="description" content="JARVIS شهروز، دستیار هوشمند فارسی">
  <link rel="manifest" href="./manifest.json"><link rel="stylesheet" href="./style.css">
  <title>J.A.R.V.I.S | شهروز</title>
</head>
<body>
  <div class="stars"></div>
  <header><div class="logo">J<span>.</span>A<span>.</span>R<span>.</span>V<span>.</span>I<span>.</span>S</div><div class="status"><i></i> سیستم آنلاین</div></header>
  <main>
    <section class="hero">
      <div class="orb"><div class="orb-core"></div><div class="ring r1"></div><div class="ring r2"></div></div>
      <p class="eyebrow">PERSONAL AI ASSISTANT</p>
      <h1>جارویس <b>شهروز</b></h1><p class="sub">در خدمت شما هستم، قربان.</p>
      <div class="chips"><span>فارسی</span><span>هوشمند</span><span>همیشه آماده</span></div>
    </section>
    <section class="chat">
      <div id="messages" class="messages">
        <article class="msg bot"><small>JARVIS</small><p>سلام قربان. من جارویس شهروز هستم. چطور می‌تونم کمکتون کنم؟</p></article>
      </div>
      <div id="listening" class="listening" hidden>در حال گوش دادن به شما...</div>
      <form id="chatForm">
        <button type="button" id="mic" class="icon-btn" aria-label="میکروفون">🎙</button>
        <input id="prompt" autocomplete="off" placeholder="پیامت رو بنویس، قربان..." />
        <button class="send" type="submit">ارسال</button>
      </form>
      <div class="quick">
        <button data-msg="کی تو رو ساخته؟">سازنده‌ات کیه؟</button>
        <button data-msg="یادت باشه که">یادداشت جدید</button>
        <button data-msg="خودت رو معرفی کن">معرفی خودت</button>
      </div>
    </section>
    <footer>J.A.R.V.I.S <span>•</span> ساخته‌شده با افتخار برای شهروز</footer>
  </main>
  <script src="./app.js"></script>
  <script>if('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(()=>{});</script>
</body></html>
